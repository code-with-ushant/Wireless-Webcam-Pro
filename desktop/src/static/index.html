<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireless Webcam - Control Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #00b4d8;
            --primary-hover: #0077b6;
            --accent-green: #00f5d4;
            --accent-red: #ff4d6d;
            --text-primary: #f8f9fa;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #00b4d8, #00f5d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            font-size: 14px;
            font-weight: 500;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-red);
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(12px);
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .no-signal {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .metric-tile {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 4px;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .slider {
            width: 100%;
            accent-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Wireless Webcam Receiver</h1>
        <div class="status-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </div>

    <div class="grid-container">
        <!-- Main Video Preview -->
        <div class="card">
            <div class="video-container">
                <img id="videoFeed" src="/api/mjpeg" alt="Live Preview Stream">
            </div>

            <div class="metrics-grid">
                <div class="metric-tile">
                    <div class="metric-label">Latency</div>
                    <div class="metric-value" id="valLatency">0.0 ms</div>
                </div>
                <div class="metric-tile">
                    <div class="metric-label">Frame Rate</div>
                    <div class="metric-value" id="valFps">0.0 FPS</div>
                </div>
                <div class="metric-tile">
                    <div class="metric-label">Bitrate</div>
                    <div class="metric-value" id="valBitrate">0.0 Mbps</div>
                </div>
                <div class="metric-tile">
                    <div class="metric-label">Dropped Frames</div>
                    <div class="metric-value" id="valDropped">0</div>
                </div>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="card">
            <h2 style="font-size: 18px; margin-bottom: 16px;">Stream Controls</h2>

            <div class="control-group">
                <label>Resolution</label>
                <div class="button-row">
                    <button class="btn" id="btn720p" onclick="setResolution('720p')">720p</button>
                    <button class="btn active" id="btn1080p" onclick="setResolution('1080p')">1080p</button>
                </div>
            </div>

            <div class="control-group">
                <label>Frame Rate</label>
                <div class="button-row">
                    <button class="btn active" id="btn30fps" onclick="setFps(30)">30 FPS</button>
                    <button class="btn" id="btn60fps" onclick="setFps(60)">60 FPS</button>
                </div>
            </div>

            <div class="control-group">
                <label>Bitrate: <span id="lblBitrate" style="color: var(--primary);">8 Mbps</span></label>
                <input type="range" min="2" max="20" value="8" class="slider" id="sliderBitrate" oninput="onBitrateChange(this.value)">
            </div>

            <div class="control-group">
                <button class="btn-action" onclick="requestKeyframe()">Force Refresh Keyframe</button>
            </div>

            <div class="control-group" style="margin-top: 24px;">
                <label>Virtual Camera Output</label>
                <button class="btn-action" id="btnVcam" style="background: var(--card-border);" onclick="toggleVcam()">Start Virtual Camera</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
